x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_TABLE_PREFIX: wp_
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define('FS_METHOD', 'direct');
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('DISABLE_WP_CRON', true);
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('WP_AUTO_UPDATE_CORE', false);
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);

services:
  db:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: wporg-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s

  wordpress:
    image: ${WPORG_WORDPRESS_IMAGE:-wordpress:7.0.2-php8.5-apache}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *wordpress-environment
    volumes:
      - wp-data:/var/www/html

  wpcli:
    image: ${WPORG_WPCLI_IMAGE:-wordpress:cli-php8.5}
    restart: "no"
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-environment
      HOME: /tmp
    volumes:
      - wp-data:/var/www/html
      - ${WPORG_FIXTURE_DIR:?runtime harness must export WPORG_FIXTURE_DIR}:/wporg-fixture:ro
    working_dir: /var/www/html

volumes:
  db-data:
  wp-data:
