worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    log_format fcmcp_timing 'FCMCP_TIMING_V4|$msec|$status|$request_time|$upstream_response_time';
    access_log /tmp/fcmcp-timing.log fcmcp_timing;
    error_log /dev/stderr notice;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    limit_req_zone $binary_remote_addr zone=mcp_rate:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=mcp_connections:1m;
    limit_req_status 429;
    limit_conn_status 509;

    upstream fluentcart_mcp {
        server backend:3000;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        server_name mcp.fixture.test;

        ssl_certificate /run/certs/server.crt;
        ssl_certificate_key /run/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;

        client_max_body_size 64k;

        location = /health {
            proxy_pass http://fluentcart_mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header Origin "";
            proxy_set_header X-Forwarded-Proto https;
        }

        location /mcp {
            limit_req zone=mcp_rate burst=5 nodelay;
            limit_conn mcp_connections 2;

            proxy_pass http://fluentcart_mcp;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
