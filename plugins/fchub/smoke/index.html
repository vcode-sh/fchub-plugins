<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FCHub smoke host</title>
    <!-- Chromium asks for a favicon whether or not one exists, and the 404 lands
         in the console the smoke suite is watching for real errors. -->
    <link rel="icon" href="data:," />
    <style>
      /* The only thing borrowed from wp-admin: #wpcontent's padding, which
         #fchub-app bleeds back past with a negative margin. Reproduce it and the
         page background reaches the edges the way it does in the admin; leave it
         out and every screenshot gains a 20px white gutter that exists nowhere.
         Nothing else about WordPress is impersonated here. */
      html,
      body {
        margin: 0;
        background: #fff;
      }

      body {
        padding: 10px 20px 0;
      }
    </style>
  </head>
  <body>
    <div id="fchub-app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
