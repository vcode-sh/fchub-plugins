# The fixture release host for the lifecycle harness.
#
# It answers to the name `catalogue` on one throwaway Compose network and to
# nothing else. The MU-plugin the harness installs allows exactly that host over
# plain HTTP, so this file is the entire internet as far as the disposable
# WordPress is concerned — and the reason no part of the lifecycle run needs a
# working connection to anywhere.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf, over the stock one.

server {
    listen 80 default_server;
    server_name catalogue;

    root /usr/share/nginx/html;

    autoindex off;
    charset utf-8;

    # nginx's own advice for anything that is not a local disk, and this root is
    # a host bind mount. sendfile hands the descriptor to the kernel and serves
    # out of the guest page cache, which is one of the ways a file replaced on
    # the host can still be served stale.
    #
    # Belt, not braces: it was not shown to be the cause of the one stale read
    # this harness has seen — 25 swaps came back fresh with sendfile on and off
    # alike — so the spec waits for the served bytes as well. This just removes
    # a plausible mechanism at no cost, on a host serving four small files.
    sendfile off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # The catalogue is rewritten mid-run to move the fixture product from 1.0.0
    # to 1.1.0, and CatalogueRepository stores the ETag it was last given and
    # sends it back as If-None-Match. With ETags on, whether the second read
    # sees a body or a 304 depends on filesystem timestamp granularity — which
    # is a coin toss dressed as a cache, and this harness has no use for either.
    location = /catalogue.json {
        etag off;
        add_header Cache-Control "no-store" always;
        default_type application/json;
    }

    # Packages and their sidecars. Served straight off disk so the checksum
    # VerifiedPackageDownloader computes is the checksum of the bytes that
    # actually moved.
    location /packages/ {
        add_header Cache-Control "no-store" always;
    }

    # Release notes are links the interface renders and nobody follows. A stub
    # beats a 404 in a screenshot taken while something else was going wrong.
    location /releases/ {
        default_type text/plain;
        return 200 "Fixture release notes. There is no release, and there are no notes.\n";
    }

    # Anything else is not part of the fixture, and a fixture host that answers
    # questions nobody wrote down is a fixture host that can hide a bug.
    location / {
        return 404;
    }
}
