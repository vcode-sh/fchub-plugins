# The disposable WordPress the lifecycle harness drives.
#
# Everything here is created and destroyed by tests/e2e/run-lifecycle.sh, under
# a project name beginning `fchub-lifecycle-` and ending in a per-run id. Two
# runs at once therefore get two projects, two networks, two sets of volumes and
# two host ports, and neither can see the other.
#
# Nothing here is shared with the long-lived playground at
# ../../../fchub-playground. Its volumes are external and named
# fchub-playground_wordpress and fchub-playground_db; the two named volumes
# below are project-scoped, so Compose creates them as
# fchub-lifecycle-<id>_db-data and fchub-lifecycle-<id>_wp-data and removes both
# on `down --volumes`. No name here can collide with one there.
#
# There is no `name:` key on purpose — the project name arrives as `-p` from the
# harness, which validates the prefix before it will bring anything up or down.

# One environment, shared by the web container and the CLI one.
#
# This is not tidiness. The wp-config.php the WordPress image writes does not
# bake anything in: it reads every value out of the environment at runtime, and
# eval()s WORDPRESS_CONFIG_EXTRA on every request. A CLI container missing this
# block would load a WordPress with no FCHUB_CATALOGUE_URL, no
# WP_HTTP_BLOCK_EXTERNAL and no FS_METHOD — the same site, configured
# differently, which is the least useful thing a test harness can be.
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_TABLE_PREFIX: wp_
  # The template already defines WP_DEBUG from this one, so the extra below
  # must not define it again.
  WORDPRESS_DEBUG: 1
  # WP_HTTP_BLOCK_EXTERNAL plus WP_ACCESSIBLE_HOSTS is the interesting pair: it
  # turns "this test does not reach the internet" from a promise into something
  # WordPress enforces. Anything dialling api.wordpress.org, github.com or
  # fchub.co gets a WP_Error instead of a socket, so a fixture that quietly
  # stopped being consulted could not be covered for by the real endpoint
  # answering in its place.
  WORDPRESS_CONFIG_EXTRA: |
    define('FCHUB_CATALOGUE_URL', 'http://catalogue/catalogue.json');
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_HTTP_BLOCK_EXTERNAL', true);
    define('WP_ACCESSIBLE_HOSTS', 'catalogue');
    define('FS_METHOD', 'direct');
    define('DISABLE_WP_CRON', true);
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('WP_AUTO_UPDATE_CORE', false);
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);

services:
  db:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: lifecycle-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db-data:/var/lib/mysql
    # A real readiness condition rather than a hopeful sleep: the WordPress
    # container is not started until the server answers and InnoDB is up.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s

  catalogue:
    image: nginx:1.27-alpine
    restart: "no"
    volumes:
      - ${FCHUB_FIXTURE_DIR:?run-lifecycle.sh must export FCHUB_FIXTURE_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only, because a site under test that could rewrite its own release
      # host would be proving something rather less interesting.
      - ${FCHUB_FIXTURE_DIR:?run-lifecycle.sh must export FCHUB_FIXTURE_DIR}/www:/usr/share/nginx/html:ro

  wordpress:
    image: wordpress:6.7-php8.1-apache
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      catalogue:
        condition: service_started
    ports:
      # Ephemeral, and on loopback. No fixed port means two runs cannot fight
      # over one, and nothing here can land on 9081 and take the playground's
      # WordPress with it.
      - "127.0.0.1::80"
    environment: *wordpress-env
    volumes:
      - wp-data:/var/www/html
      # The generated fixtures, read-only: the MU-plugin the harness copies into
      # place, and the package archives WP-CLI installs FCHub itself from.
      - ${FCHUB_FIXTURE_DIR:?run-lifecycle.sh must export FCHUB_FIXTURE_DIR}:/fchub-fixtures:ro

  wpcli:
    image: wordpress:cli-php8.1
    restart: "no"
    # Debian's www-data is uid 33 and Alpine's is 82, and this image is Alpine.
    # Left alone, every file WP-CLI wrote would be owned by a user Apache has
    # never heard of, and the first plugin install through the interface would
    # fail on permissions for reasons that have nothing to do with FCHub.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      # WP-CLI wants somewhere writable for its cache and config, and uid 33 has
      # no home directory in this image.
      HOME: /tmp
    volumes:
      - wp-data:/var/www/html
      - ${FCHUB_FIXTURE_DIR:?run-lifecycle.sh must export FCHUB_FIXTURE_DIR}:/fchub-fixtures:ro
    working_dir: /var/www/html

volumes:
  db-data:
  wp-data:
