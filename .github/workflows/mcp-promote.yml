# Automatic release promotion after Trusted Publishing, with an exact manual recovery entry point.
# This workflow has no npm credential or npm write; it verifies public bytes before mutable promotion.
name: MCP Promote

on:
  workflow_call:
    inputs:
      version:
        description: 'Exact published version.'
        required: true
        type: string
      source_sha:
        description: 'Exact committed source SHA.'
        required: true
        type: string
      staging_run_id:
        description: 'Run containing immutable release evidence.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact published version.'
        required: true
        type: string
      source_sha:
        description: 'Exact committed source SHA.'
        required: true
        type: string
      staging_run_id:
        description: 'Run containing immutable release evidence.'
        required: true
        type: string

concurrency:
  group: mcp-promote-${{ inputs.version }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/vcode-sh/fluentcart-mcp
  DOCKERHUB_IMAGE: vcodesh/fluentcart-mcp

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: mcp-production
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '26.7.0'
      - name: Verify reviewed release toolchain
        run: |
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "11.19.0"
      - name: Download exact staging evidence
        uses: actions/download-artifact@v8
        with:
          name: fluentcart-mcp-staging-${{ inputs.version }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Verify every downloaded byte and embedded provenance
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node -e "const s=require('./staging-state.json'); if(s.version!==process.env.VERSION||s.sourceSha!==process.env.SOURCE_SHA) throw Error('staging identity mismatch')"
          test -f verification/scripts/inspect-npm-pack.mjs
          test -f verification/scripts/inspect-mcpb.mjs
          node verification/scripts/verify-staged-release.mjs --root .
      - name: Verify npm latest, public bytes and both protocol eras
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          EXPECTED=$(node -p "const s=require('./staging-state.json'); s.npm?.expectedIntegrity ?? s.npmIntegrity")
          ACTUAL=""
          LATEST=""
          for _ in {1..12}; do
            ACTUAL=$(npm view "fluentcart-mcp@${VERSION}" dist.integrity --json \
              --registry https://registry.npmjs.org 2>/dev/null | tr -d '"' || true)
            LATEST=$(npm view fluentcart-mcp dist-tags.latest --json \
              --registry https://registry.npmjs.org 2>/dev/null | tr -d '"' || true)
            if [ "$ACTUAL" = "$EXPECTED" ] && [ "$LATEST" = "$VERSION" ]; then
              break
            fi
            sleep 5
          done
          test "$ACTUAL" = "$EXPECTED"
          test "$LATEST" = "$VERSION"
          SMOKE="$PWD/verification/scripts/smoke-public-stdio.mjs"
          if [ ! -f "$SMOKE" ]; then
            SCHEMA_VERSION=$(node -p "require('./staging-state.json').schemaVersion")
            test "$SCHEMA_VERSION" = "2"
            SMOKE="$RUNNER_TEMP/fluentcart-mcp-smoke-public-stdio.mjs"
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/fluentcart-mcp/scripts/smoke-public-stdio.mjs?ref=${SOURCE_SHA}" \
              > "$SMOKE"
          fi
          mkdir public clean
          npm pack "fluentcart-mcp@${VERSION}" --pack-destination public \
            --registry https://registry.npmjs.org
          TARBALL="fluentcart-mcp-${VERSION}.tgz"
          EXPECTED_SHA=$(node -e "const s=require('./SHA256SUMS.json'); console.log(s.files.find(x=>x.file==='$TARBALL').sha256)")
          ACTUAL_SHA=$(sha256sum "public/$TARBALL" | cut -d' ' -f1)
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          cp "$SMOKE" clean/smoke-public-stdio.mjs
          cd clean
          npm init -y
          npm add --ignore-scripts --registry https://registry.npmjs.org \
            "../public/$TARBALL" @modelcontextprotocol/client@2.0.0
          node smoke-public-stdio.mjs node_modules/fluentcart-mcp/dist/index.js
      - name: Verify versioned Docker digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          GHCR_EXPECTED=$(node -p "require('./staging-state.json').dockerDigests['ghcr.io']")
          DOCKERHUB_EXPECTED=$(node -p "require('./staging-state.json').dockerDigests['docker.io']")
          GHCR_ACTUAL=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          DOCKERHUB_ACTUAL=$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$GHCR_ACTUAL" = "$GHCR_EXPECTED"
          test "$DOCKERHUB_ACTUAL" = "$DOCKERHUB_EXPECTED"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the same Docker digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          GHCR_DIGEST=$(node -p "require('./staging-state.json').dockerDigests['ghcr.io']")
          DOCKERHUB_DIGEST=$(node -p "require('./staging-state.json').dockerDigests['docker.io']")
          docker buildx imagetools create --prefer-index=false \
            --tag "${GHCR_IMAGE}:latest" "${GHCR_IMAGE}@${GHCR_DIGEST}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${DOCKERHUB_IMAGE}:latest" "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"
          GHCR_LATEST=$(docker buildx imagetools inspect "${GHCR_IMAGE}:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          DOCKERHUB_LATEST=$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$GHCR_LATEST" = "$GHCR_DIGEST"
          test "$DOCKERHUB_LATEST" = "$DOCKERHUB_DIGEST"
      - name: Publish or verify GitHub Release from staged bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="fluentcart-mcp/v${VERSION}"
          ASSETS=(
            "fluentcart-mcp.mcpb"
            "fluentcart-mcp-${VERSION}.tgz"
            "SHA256SUMS.json"
            "release-contract.json"
          )
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            RELEASE_DIR="$RUNNER_TEMP/existing-release"
            mkdir "$RELEASE_DIR"
            gh release download "$TAG" --repo "${{ github.repository }}" --dir "$RELEASE_DIR"
            test "$(find "$RELEASE_DIR" -maxdepth 1 -type f | wc -l)" -eq "${#ASSETS[@]}"
            for ASSET in "${ASSETS[@]}"; do
              cmp "$ASSET" "$RELEASE_DIR/$ASSET"
            done
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "fluentcart-mcp v${VERSION}" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
