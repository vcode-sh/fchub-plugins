name: Release Plugin

on:
  push:
    # fchub-stream is deliberately absent. It is discontinued, and publishing a
    # plugin nobody maintains should take more than pushing a tag out of habit.
    # Its build steps further down stay exactly where they are — the project may
    # return, and other people may fork it — so restoring the trigger is a
    # one-line decision for whoever makes it.
    tags:
      - 'fchub-p24/v*'
      - 'fchub-fakturownia/v*'
      - 'fchub-memberships/v*'
      - 'fchub-portal-extender/v*'
      - 'fchub-wishlist/v*'
      - 'fchub-multi-currency/v*'
      - 'cartshift/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # An FCHub tag runs the disposable-WordPress harness and a Playwright
    # install in this job, so it can stand up containers and pull images. The
    # default ceiling is six hours; a wedged pull should not hold a runner for
    # most of a working day when the whole job takes minutes.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_SLUG="${TAG%%/v*}"
          VERSION="${TAG#*/v}"
          echo "slug=$PLUGIN_SLUG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin: $PLUGIN_SLUG, Version: $VERSION"

      - name: Validate version in plugin header
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"
          MAIN_FILE="plugins/${SLUG}/${SLUG}.php"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "::error::Main plugin file not found: $MAIN_FILE"
            exit 1
          fi

          HEADER_VERSION=$(grep -i "^[[:space:]]*\*[[:space:]]*Version:" "$MAIN_FILE" | head -1 | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')

          if [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch! Tag: $VERSION, Header: $HEADER_VERSION"
            exit 1
          fi

          echo "Version validated: $VERSION"

      - name: Check versions.json consistency
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"
          DOCS_VERSION=$(node -e "const v=JSON.parse(require('fs').readFileSync('web-docs/lib/versions.json','utf8'));console.log(v.plugins['${SLUG}']?.version??'NOT_FOUND')")
          if [ "$DOCS_VERSION" != "$VERSION" ]; then
            echo "::error::versions.json has ${SLUG} at v${DOCS_VERSION}, tag is v${VERSION}."
            exit 1
          fi

      - name: Setup Node.js
        if: steps.tag.outputs.slug == 'fchub-memberships' || steps.tag.outputs.slug == 'fchub-portal-extender' || steps.tag.outputs.slug == 'fchub-stream'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: composer audit --locked --no-interaction

      - name: Run PHPUnit (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: ./vendor/bin/phpunit

      - name: Install npm dependencies (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: npm ci

      - name: Audit npm dependencies (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: npm audit --audit-level=high

      - name: Run Vitest (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: npm run test

      - name: Run Playwright (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: |
          npx playwright install --with-deps chromium
          npm run test:smoke

      - name: Build assets (fchub-memberships)
        if: steps.tag.outputs.slug == 'fchub-memberships'
        working-directory: plugins/fchub-memberships
        run: |
          npm run build

          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build failed — assets/dist/ is empty"
            exit 1
          fi

          echo "Build output:"
          ls -la assets/dist/

      - name: Build assets (fchub-portal-extender)
        if: steps.tag.outputs.slug == 'fchub-portal-extender'
        working-directory: plugins/fchub-portal-extender
        run: |
          npm ci
          npm run build

          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build failed — assets/dist/ is empty"
            exit 1
          fi

          echo "Build output:"
          ls -la assets/dist/

      - name: Build assets (fchub-stream)
        if: steps.tag.outputs.slug == 'fchub-stream'
        run: |
          cd plugins/fchub-stream/admin-app
          npm ci
          npm run build

          if [ ! -d "../admin/dist" ] || [ -z "$(ls -A ../admin/dist)" ]; then
            echo "::error::admin-app build failed — admin/dist/ is empty"
            exit 1
          fi

          echo "admin-app build output:"
          ls -la ../admin/dist/

          cd ../portal-app
          npm ci
          npm run build

          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::portal-app build failed — portal-app/dist/ is empty"
            exit 1
          fi

          echo "portal-app build output:"
          ls -la dist/

      - name: Sync GitHubUpdater
        # Every product except the hub. FCHub carries a namespaced updater of its
        # own, and the shared one would ship beside it as a second, conflicting
        # copy of the same job.
        if: steps.tag.outputs.slug != 'fchub'
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          PLUGIN_DIR="plugins/${SLUG}"
          mkdir -p "${PLUGIN_DIR}/lib"
          cp lib/GitHubUpdater.php "${PLUGIN_DIR}/lib/GitHubUpdater.php"
          echo "Synced GitHubUpdater into ${SLUG}"

      - name: Build ZIP
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"
          PLUGIN_DIR="plugins/${SLUG}"
          ZIP_NAME="${SLUG}-${VERSION}.zip"

          tmp_dir=$(mktemp -d)

          # Build rsync exclude args from .distignore
          exclude_args=()
          if [ -f "${PLUGIN_DIR}/.distignore" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [[ -z "$line" || "$line" =~ ^# ]] && continue
              exclude_args+=(--exclude="$line")
            done < "${PLUGIN_DIR}/.distignore"
          fi

          rsync -a "${exclude_args[@]}" "${PLUGIN_DIR}/" "${tmp_dir}/${SLUG}/"

          (cd "$tmp_dir" && zip -qr "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${SLUG}/")

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "zip_path=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> "$GITHUB_ENV"

          echo "Created: $ZIP_NAME"
          ls -lh "${GITHUB_WORKSPACE}/${ZIP_NAME}"

      - name: Create checksum sidecar
        # Every product, not only the hub. FCHub verifies what it downloads
        # against `<package>.sha256` beside the package, and treats a missing one
        # as `checksum_unavailable` — installing anyway, because releases published
        # before sidecars existed still have to be installable. That concession
        # only stays a legacy path if every release from here on ships one.
        #
        # Run from the directory holding the archive so the sidecar names the
        # file rather than a path on a runner that no longer exists, which is
        # what `sha256sum -c` needs after a download.
        run: |
          (cd "$(dirname "${zip_path}")" && sha256sum "$(basename "${zip_path}")" > "$(basename "${zip_path}").sha256")

          echo "checksum_path=${zip_path}.sha256" >> "$GITHUB_ENV"

          cat "${zip_path}.sha256"

      - name: Generate release notes
        id: notes
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"

          # Get commits since last tag for this plugin
          PREV_TAG=$(git tag -l "${SLUG}/v*" --sort=-v:refname | head -2 | tail -1)

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${GITHUB_REF_NAME}" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" -- "plugins/${SLUG}/")
          else
            NOTES=$(git log --pretty=format:"- %s" -20 -- "plugins/${SLUG}/")
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- Release ${SLUG} v${{ steps.tag.outputs.version }}"
          fi

          # Write to file to handle multiline
          echo "$NOTES" > release_notes.txt
          echo "Generated release notes"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"

          gh release create "${GITHUB_REF_NAME}" \
            "${zip_path}" \
            "${checksum_path}" \
            --title "${SLUG} v${VERSION}" \
            --notes-file release_notes.txt
