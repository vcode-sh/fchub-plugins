name: Release Plugin

on:
  workflow_dispatch:
  push:
    # fchub-stream is deliberately absent. It is discontinued, and publishing a
    # plugin nobody maintains should take more than pushing a tag out of habit.
    # Its build steps further down stay exactly where they are — the project may
    # return, and other people may fork it — so restoring the trigger is a
    # one-line decision for whoever makes it.
    tags:
      - 'fchub-p24/v*'
      - 'fchub-fakturownia/v*'
      - 'fchub-memberships/v*'
      - 'fchub-portal-extender/v*'
      - 'fchub-wishlist/v*'
      - 'fchub-multi-currency/v*'
      - 'cartshift/v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.tag.outputs.slug }}
      version: ${{ steps.tag.outputs.version }}
      is_wporg: ${{ steps.tag.outputs.is_wporg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_SLUG="${TAG%%/v*}"
          VERSION="${TAG#*/v}"
          echo "slug=$PLUGIN_SLUG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Paused while WordPress.org review is pending: the plugin is not listed
          # there yet, so it ships the GitHub updater and the directory gates —
          # which reject exactly that — must not run. See wporg/plugins.json.
          IS_WPORG=$(node -e 'const manifest=require("./wporg/plugins.json"); process.stdout.write(String(manifest.submissionPaused !== true && Object.hasOwn(manifest.plugins, process.argv[1])))' "$PLUGIN_SLUG")
          echo "is_wporg=$IS_WPORG" >> "$GITHUB_OUTPUT"
          echo "Plugin: $PLUGIN_SLUG, Version: $VERSION"

      - name: Validate version in plugin header
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"
          MAIN_FILE="plugins/${SLUG}/${SLUG}.php"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "::error::Main plugin file not found: $MAIN_FILE"
            exit 1
          fi

          HEADER_VERSION=$(grep -i "^[[:space:]]*\*[[:space:]]*Version:" "$MAIN_FILE" | head -1 | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')

          if [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch! Tag: $VERSION, Header: $HEADER_VERSION"
            exit 1
          fi

          echo "Version validated: $VERSION"

      - name: Check versions.json consistency
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"
          DOCS_VERSION=$(node -e "const v=JSON.parse(require('fs').readFileSync('web-docs/lib/versions.json','utf8'));console.log(v.plugins['${SLUG}']?.version??'NOT_FOUND')")
          if [ "$DOCS_VERSION" != "$VERSION" ]; then
            echo "::error::versions.json has ${SLUG} at v${DOCS_VERSION}, tag is v${VERSION}."
            exit 1
          fi

  wporg-gates:
    name: WordPress.org tag gates
    needs: prepare
    if: needs.prepare.outputs.is_wporg == 'true'
    uses: ./.github/workflows/wporg-release-gates.yml
    with:
      tagged_slug: ${{ needs.prepare.outputs.slug }}
      tagged_version: ${{ needs.prepare.outputs.version }}

  cartshift-contract:
    name: CartShift tagged candidate contracts
    needs: prepare
    if: needs.prepare.outputs.slug == 'cartshift'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout validated tag SHA
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install candidate test dependencies
        working-directory: plugins/cartshift
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Build tagged candidate
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) ./build.sh cartshift
          CANDIDATE="$GITHUB_WORKSPACE/dist/cartshift-${{ needs.prepare.outputs.version }}.zip"
          test -f "$CANDIDATE"
          {
            echo "CARTSHIFT_CANDIDATE_ZIP=$CANDIDATE"
            echo "CARTSHIFT_CANDIDATE_SHA256=$(sha256sum "$CANDIDATE" | awk '{print $1}')"
            echo "CARTSHIFT_EXPECT_CANDIDATE_VERSION=${{ needs.prepare.outputs.version }}"
          } >> "$GITHUB_ENV"

      - name: Download and verify private vendor artifacts
        env:
          WOO_URL: ${{ secrets.CARTSHIFT_WOO_ARTIFACT_URL }}
          WOO_SHA256: ${{ vars.CARTSHIFT_WOO_SHA256 }}
          WCS_URL: ${{ secrets.CARTSHIFT_WCS_ARTIFACT_URL }}
          WCS_SHA256: ${{ vars.CARTSHIFT_WCS_SHA256 }}
          FLUENTCART_URL: ${{ secrets.CARTSHIFT_FLUENTCART_ARTIFACT_URL }}
          FLUENTCART_SHA256: ${{ vars.CARTSHIFT_FLUENTCART_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/cartshift-vendors"
          fetch() {
            local name="$1" url="$2" digest="$3" destination="$RUNNER_TEMP/cartshift-vendors/$1.zip"
            test -n "$url" || { echo "::error::${name} private artifact URL is unavailable"; exit 1; }
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::${name} SHA-256 is unavailable or invalid"; exit 1; }
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$url" --output "$destination"
            echo "${digest}  ${destination}" | sha256sum --check --status
            printf '%s\n' "$destination"
          }
          WOO_PATH=$(fetch woocommerce "$WOO_URL" "$WOO_SHA256")
          WCS_PATH=$(fetch woocommerce-subscriptions "$WCS_URL" "$WCS_SHA256")
          FLUENTCART_PATH=$(fetch fluent-cart "$FLUENTCART_URL" "$FLUENTCART_SHA256")
          {
            echo "CARTSHIFT_WOO_ZIP=$WOO_PATH"
            echo "CARTSHIFT_WOO_SHA256=$WOO_SHA256"
            echo "CARTSHIFT_WCS_ZIP=$WCS_PATH"
            echo "CARTSHIFT_WCS_SHA256=$WCS_SHA256"
            echo "CARTSHIFT_FLUENTCART_ZIP=$FLUENTCART_PATH"
            echo "CARTSHIFT_FLUENTCART_SHA256=$FLUENTCART_SHA256"
          } >> "$GITHUB_ENV"

      - name: Run installed tagged candidate contracts
        working-directory: plugins/cartshift
        env:
          CARTSHIFT_CONTRACT_RETAIN_EVIDENCE_DIR: ${{ runner.temp }}/cartshift-installed-evidence
        run: tests/Integration/scripts/run-installed-contracts.sh

      - name: Upload tested CartShift candidate
        uses: actions/upload-artifact@v7
        with:
          name: cartshift-candidate-${{ github.sha }}
          path: ${{ env.CARTSHIFT_CANDIDATE_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload installed-contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cartshift-installed-contract-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/cartshift-installed-evidence
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release
    needs: [prepare, wporg-gates, cartshift-contract]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.wporg-gates.result == 'success' ||
      needs.wporg-gates.result == 'skipped') &&
      ((needs.prepare.outputs.slug == 'cartshift' && needs.cartshift-contract.result == 'success') ||
      (needs.prepare.outputs.slug != 'cartshift' && needs.cartshift-contract.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated tag SHA
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build assets (fchub-portal-extender)
        if: needs.prepare.outputs.slug == 'fchub-portal-extender'
        working-directory: plugins/fchub-portal-extender
        run: |
          npm ci
          npm run build

          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build failed — assets/dist/ is empty"
            exit 1
          fi

          echo "Build output:"
          ls -la assets/dist/

      - name: Sync GitHubUpdater
        # WordPress.org bridge releases must not restore the updater removed
        # from their source. Non-directory products retain the existing feed.
        if: needs.prepare.outputs.is_wporg != 'true' && needs.prepare.outputs.slug != 'cartshift'
        run: |
          SLUG="${{ needs.prepare.outputs.slug }}"
          PLUGIN_DIR="plugins/${SLUG}"
          mkdir -p "${PLUGIN_DIR}/lib"
          cp lib/GitHubUpdater.php "${PLUGIN_DIR}/lib/GitHubUpdater.php"
          echo "Synced GitHubUpdater into ${SLUG}"

      - name: Build non-WordPress.org ZIP
        if: needs.prepare.outputs.is_wporg != 'true' && needs.prepare.outputs.slug != 'cartshift'
        run: |
          bash build.sh "${{ needs.prepare.outputs.slug }}"

      - name: Download tested CartShift candidate
        if: needs.prepare.outputs.slug == 'cartshift'
        uses: actions/download-artifact@v8
        with:
          name: cartshift-candidate-${{ github.sha }}
          path: dist

      - name: Download validated WordPress.org ZIP
        if: needs.prepare.outputs.is_wporg == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wporg-package-${{ needs.prepare.outputs.slug }}
          path: dist

      - name: Locate release ZIP
        run: |
          SLUG="${{ needs.prepare.outputs.slug }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ZIP_NAME="${SLUG}-${VERSION}.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/dist/${ZIP_NAME}"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Validated release package not found: $ZIP_PATH"
            exit 1
          fi
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_ENV"

          echo "Validated: $ZIP_NAME"
          ls -lh "$ZIP_PATH"

      - name: Create checksum sidecar
        # Every product, not only the hub. FCHub verifies what it downloads
        # against `<package>.sha256` beside the package, and treats a missing one
        # as `checksum_unavailable` — installing anyway, because releases published
        # before sidecars existed still have to be installable. That concession
        # only stays a legacy path if every release from here on ships one.
        #
        # Run from the directory holding the archive so the sidecar names the
        # file rather than a path on a runner that no longer exists, which is
        # what `sha256sum -c` needs after a download.
        run: |
          (cd "$(dirname "${zip_path}")" && sha256sum "$(basename "${zip_path}")" > "$(basename "${zip_path}").sha256")

          echo "checksum_path=${zip_path}.sha256" >> "$GITHUB_ENV"

          cat "${zip_path}.sha256"

      - name: Generate release notes
        id: notes
        run: |
          SLUG="${{ needs.prepare.outputs.slug }}"

          # Get commits since last tag for this plugin
          PREV_TAG=$(git tag -l "${SLUG}/v*" --sort=-v:refname | head -2 | tail -1)

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${GITHUB_REF_NAME}" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" -- "plugins/${SLUG}/")
          else
            NOTES=$(git log --pretty=format:"- %s" -20 -- "plugins/${SLUG}/")
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- Release ${SLUG} v${{ needs.prepare.outputs.version }}"
          fi

          # Write to file to handle multiline
          echo "$NOTES" > release_notes.txt
          echo "Generated release notes"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ needs.prepare.outputs.slug }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          gh release create "${GITHUB_REF_NAME}" \
            "${zip_path}" \
            "${checksum_path}" \
            --title "${SLUG} v${VERSION}" \
            --notes-file release_notes.txt
