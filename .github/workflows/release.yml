name: Release Plugin

on:
  workflow_dispatch:
  push:
    # fchub-stream is deliberately absent. It is discontinued, and publishing a
    # plugin nobody maintains should take more than pushing a tag out of habit.
    # Its build steps further down stay exactly where they are — the project may
    # return, and other people may fork it — so restoring the trigger is a
    # one-line decision for whoever makes it.
    tags:
      - 'fchub-p24/v*'
      - 'fchub-fakturownia/v*'
      - 'fchub-memberships/v*'
      - 'fchub-portal-extender/v*'
      - 'fchub-wishlist/v*'
      - 'fchub-multi-currency/v*'
      - 'cartshift/v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.tag.outputs.slug }}
      version: ${{ steps.tag.outputs.version }}
      is_wporg: ${{ steps.tag.outputs.is_wporg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_SLUG="${TAG%%/v*}"
          VERSION="${TAG#*/v}"
          echo "slug=$PLUGIN_SLUG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Paused while WordPress.org review is pending: the plugin is not listed
          # there yet, so it ships the GitHub updater and the directory gates —
          # which reject exactly that — must not run. See wporg/plugins.json.
          IS_WPORG=$(node -e 'const manifest=require("./wporg/plugins.json"); process.stdout.write(String(manifest.submissionPaused !== true && Object.hasOwn(manifest.plugins, process.argv[1])))' "$PLUGIN_SLUG")
          echo "is_wporg=$IS_WPORG" >> "$GITHUB_OUTPUT"
          echo "Plugin: $PLUGIN_SLUG, Version: $VERSION"

      - name: Validate version in plugin header
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"
          MAIN_FILE="plugins/${SLUG}/${SLUG}.php"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "::error::Main plugin file not found: $MAIN_FILE"
            exit 1
          fi

          HEADER_VERSION=$(grep -i "^[[:space:]]*\*[[:space:]]*Version:" "$MAIN_FILE" | head -1 | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')

          if [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "::error::Version mismatch! Tag: $VERSION, Header: $HEADER_VERSION"
            exit 1
          fi

          echo "Version validated: $VERSION"

      - name: Check versions.json consistency
        run: |
          SLUG="${{ steps.tag.outputs.slug }}"
          VERSION="${{ steps.tag.outputs.version }}"
          DOCS_VERSION=$(node -e "const v=JSON.parse(require('fs').readFileSync('web-docs/lib/versions.json','utf8'));console.log(v.plugins['${SLUG}']?.version??'NOT_FOUND')")
          if [ "$DOCS_VERSION" != "$VERSION" ]; then
            echo "::error::versions.json has ${SLUG} at v${DOCS_VERSION}, tag is v${VERSION}."
            exit 1
          fi

  wporg-gates:
    name: WordPress.org tag gates
    needs: prepare
    if: needs.prepare.outputs.is_wporg == 'true'
    uses: ./.github/workflows/wporg-release-gates.yml
    with:
      tagged_slug: ${{ needs.prepare.outputs.slug }}
      tagged_version: ${{ needs.prepare.outputs.version }}

  release:
    name: Publish release
    needs: [prepare, wporg-gates]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.wporg-gates.result == 'success' ||
      needs.wporg-gates.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated tag SHA
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build assets (fchub-portal-extender)
        if: needs.prepare.outputs.slug == 'fchub-portal-extender'
        working-directory: plugins/fchub-portal-extender
        run: |
          npm ci
          npm run build

          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build failed — assets/dist/ is empty"
            exit 1
          fi

          echo "Build output:"
          ls -la assets/dist/

      - name: Build non-WordPress.org ZIP
        if: needs.prepare.outputs.is_wporg != 'true'
        run: |
          bash build.sh "${{ needs.prepare.outputs.slug }}"

      - name: Download validated WordPress.org ZIP
        if: needs.prepare.outputs.is_wporg == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wporg-package-${{ needs.prepare.outputs.slug }}
          path: dist

      - name: Locate release ZIP
        run: |
          SLUG="${{ needs.prepare.outputs.slug }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ZIP_NAME="${SLUG}-${VERSION}.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/dist/${ZIP_NAME}"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Validated release package not found: $ZIP_PATH"
            exit 1
          fi
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_ENV"

          echo "Validated: $ZIP_NAME"
          ls -lh "$ZIP_PATH"

      - name: Create checksum sidecar
        # Every product, not only the hub. FCHub verifies what it downloads
        # against `<package>.sha256` beside the package, and treats a missing one
        # as `checksum_unavailable` — installing anyway, because releases published
        # before sidecars existed still have to be installable. That concession
        # only stays a legacy path if every release from here on ships one.
        #
        # Run from the directory holding the archive so the sidecar names the
        # file rather than a path on a runner that no longer exists, which is
        # what `sha256sum -c` needs after a download.
        run: |
          (cd "$(dirname "${zip_path}")" && sha256sum "$(basename "${zip_path}")" > "$(basename "${zip_path}").sha256")

          echo "checksum_path=${zip_path}.sha256" >> "$GITHUB_ENV"

          cat "${zip_path}.sha256"

      - name: Generate release notes
        id: notes
        run: |
          SLUG="${{ needs.prepare.outputs.slug }}"

          # Get commits since last tag for this plugin
          PREV_TAG=$(git tag -l "${SLUG}/v*" --sort=-v:refname | head -2 | tail -1)

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${GITHUB_REF_NAME}" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" -- "plugins/${SLUG}/")
          else
            NOTES=$(git log --pretty=format:"- %s" -20 -- "plugins/${SLUG}/")
          fi

          if [ -z "$NOTES" ]; then
            NOTES="- Release ${SLUG} v${{ needs.prepare.outputs.version }}"
          fi

          # Write to file to handle multiline
          echo "$NOTES" > release_notes.txt
          echo "Generated release notes"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ needs.prepare.outputs.slug }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          gh release create "${GITHUB_REF_NAME}" \
            "${zip_path}" \
            "${checksum_path}" \
            --title "${SLUG} v${VERSION}" \
            --notes-file release_notes.txt
