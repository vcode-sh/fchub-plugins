name: CI

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'web-docs/lib/versions.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-memberships-contract.test.mjs'
      - '.github/workflows/ci-wporg-contract.test.mjs'
      - '.github/workflows/fchub-ci-contract.test.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-memberships-contract.test.mjs'
      - '.github/workflows/release-wporg-gates-contract.test.mjs'
      - '.github/workflows/wporg-release-gates.yml'
      - '.github/workflows/docs-ci.yml'
      - 'scripts/sync-fchub-catalog.mjs'
      - 'scripts/check-fchub-docs.mjs'
      - 'tests/repository/fchub-catalog.test.mjs'
      - 'tests/repository/wporg-package-contract.test.mjs'
      - 'tests/repository/wporg-updater-sync-contract.test.mjs'
      - 'tests/repository/wporg-metadata-contract.test.mjs'
      - 'tests/repository/wporg-previous-release-contract.test.mjs'
      - 'tests/repository/wporg-lifecycle-update-contract.test.mjs'
      - 'web-docs/lib/fchub-products.json'
      - 'wporg/**'
      - 'scripts/wporg/**'
      - 'build.sh'
      - 'lib/GitHubUpdater.php'

jobs:
  workflow-contract:
    name: Workflow contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run owned workflow contracts
        run: node --test .github/workflows/ci-memberships-contract.test.mjs .github/workflows/ci-wporg-contract.test.mjs .github/workflows/release-memberships-contract.test.mjs .github/workflows/release-wporg-gates-contract.test.mjs

      - name: Run WordPress.org directory asset contracts
        run: node --test tests/repository/wporg-directory-assets-contract.test.mjs tests/repository/wporg-directory-screenshots-contract.test.mjs tests/repository/wporg-asset-approval-contract.test.mjs

      - name: Run WordPress.org release artifact contracts
        run: node --test tests/repository/wporg-metadata-contract.test.mjs tests/repository/wporg-previous-release-contract.test.mjs tests/repository/wporg-lifecycle-update-contract.test.mjs

      - name: Run FCHub workflow contracts
        run: node --test .github/workflows/fchub-ci-contract.test.mjs

  phpunit:
    name: PHPUnit (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - plugin: fchub-fakturownia
            php_version: '8.4'
            fetch_depth: 0
          - plugin: fchub-fakturownia
            php_version: '8.5'
            fetch_depth: 0
          - plugin: fchub-memberships
            php_version: '8.4'
            fetch_depth: 0
          - plugin: fchub-memberships
            php_version: '8.5'
            fetch_depth: 0
          - plugin: fchub-multi-currency
            php_version: '8.4'
            fetch_depth: 0
          - plugin: fchub-multi-currency
            php_version: '8.5'
            fetch_depth: 0
          - plugin: fchub-p24
            php_version: '8.4'
            fetch_depth: 0
          - plugin: fchub-p24
            php_version: '8.5'
            fetch_depth: 0
          # Retain the discontinued Stream marker for the reversible-hiatus
          # contract. Its depth-1 checkout deliberately keeps the existing
          # change detector inert, so this does not resume Stream testing.
          - plugin: fchub-stream
            php_version: '8.3'
            fetch_depth: 1
          - plugin: fchub-wishlist
            php_version: '8.4'
            fetch_depth: 0
          - plugin: fchub-wishlist
            php_version: '8.5'
            fetch_depth: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.fetch_depth }}

      - name: Check for changes
        id: changes
        run: |
          if [ "${{ matrix.plugin }}" = "fchub-memberships" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- plugins/${{ matrix.plugin }}/ web-docs/lib/versions.json | wc -l)
          else
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- plugins/${{ matrix.plugin }}/ | wc -l)
          fi
          echo "count=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.changes.outputs.count > 0
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        if: steps.changes.outputs.count > 0
        working-directory: plugins/${{ matrix.plugin }}
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        if: steps.changes.outputs.count > 0
        working-directory: plugins/${{ matrix.plugin }}
        run: composer audit --locked --no-interaction

      - name: Run PHPUnit
        if: steps.changes.outputs.count > 0
        working-directory: plugins/${{ matrix.plugin }}
        run: ./vendor/bin/phpunit

      - name: Run static quality checks
        if: steps.changes.outputs.count > 0 && matrix.php_version == '8.5' && (matrix.plugin == 'fchub-fakturownia' || matrix.plugin == 'fchub-multi-currency' || matrix.plugin == 'fchub-p24' || matrix.plugin == 'fchub-wishlist')
        working-directory: plugins/${{ matrix.plugin }}
        run: composer check

      - name: Run LOC budget check (fchub-wishlist)
        if: steps.changes.outputs.count > 0 && matrix.plugin == 'fchub-wishlist'
        working-directory: plugins/fchub-wishlist
        run: bash scripts/check-loc.sh

  wporg-package:
    name: WordPress.org package (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: fchub-fakturownia
          - plugin: fchub-memberships
          - plugin: fchub-multi-currency
          - plugin: fchub-p24
          - plugin: fchub-wishlist
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and inspect archive
        run: bash build.sh "${{ matrix.plugin }}"

      - name: Upload rejected package evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wporg-package-${{ matrix.plugin }}-failure
          path: |
            dist/${{ matrix.plugin }}-*.zip
            dist/${{ matrix.plugin }}-*.inspection.json
          if-no-files-found: warn

  vite-build-memberships:
    name: Vite Build (fchub-memberships)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `Check for changes` below diffs against the pull request base, which
          # a depth-1 checkout does not contain: the diff fails, the count comes
          # back zero, and every gate here skips itself while the job reports
          # green. Fetch the history the diff actually needs.
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- plugins/fchub-memberships/ | wc -l)
          echo "count=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.count > 0
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: plugins/fchub-memberships/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-memberships
        run: npm ci

      - name: Audit JavaScript dependencies
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-memberships
        run: npm audit --audit-level=high

      - name: Run JavaScript tests
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-memberships
        run: npm test

      - name: Cache Playwright browsers
        if: steps.changes.outputs.count > 0
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('plugins/fchub-memberships/package-lock.json') }}

      - name: Install Chromium
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-memberships
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-memberships
        run: npx playwright test

      - name: Build production assets
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-memberships
        run: npm run build

      - name: Validate build output
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-memberships
        run: |
          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build produced no output in assets/dist/"
            exit 1
          fi

          JS_COUNT=$(find assets/dist -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JS files found in assets/dist/"
            exit 1
          fi

          echo "Build validation passed: $JS_COUNT JS file(s) in assets/dist/"

  vite-build-portal-extender:
    name: Vite Build (fchub-portal-extender)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `Check for changes` below diffs against the pull request base, which
          # a depth-1 checkout does not contain: the diff fails, the count comes
          # back zero, and every gate here skips itself while the job reports
          # green. Fetch the history the diff actually needs.
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- plugins/fchub-portal-extender/ | wc -l)
          echo "count=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.count > 0
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: plugins/fchub-portal-extender/package-lock.json

      - name: Install and build
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-portal-extender
        run: |
          npm ci
          npm run build

      - name: Validate build output
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-portal-extender
        run: |
          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build produced no output in assets/dist/"
            exit 1
          fi

          JS_COUNT=$(find assets/dist -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JS files found in assets/dist/"
            exit 1
          fi

          echo "Build validation passed: $JS_COUNT JS file(s) in assets/dist/"

  vite-build-stream:
    name: Vite Build (fchub-stream)
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth here, deliberately. Stream is discontinued and must not
      # be built or tested; a depth-1 checkout cannot reach the pull request
      # base, so the change count stays zero and every step below skips. The
      # job remains because the repository asserts Stream is still here for a
      # possible return, not because anything is expected to run.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- plugins/fchub-stream/ | wc -l)
          echo "count=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changes.outputs.count > 0
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build admin-app
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-stream/admin-app
        run: |
          npm ci
          npm run build

      - name: Validate admin-app build
        if: steps.changes.outputs.count > 0
        run: |
          if [ ! -d "plugins/fchub-stream/admin/dist" ] || [ -z "$(ls -A plugins/fchub-stream/admin/dist)" ]; then
            echo "::error::admin-app build produced no output in admin/dist/"
            exit 1
          fi

          JS_COUNT=$(find plugins/fchub-stream/admin/dist -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JS files found in admin/dist/"
            exit 1
          fi

          echo "admin-app build validation passed: $JS_COUNT JS file(s)"

      - name: Build portal-app
        if: steps.changes.outputs.count > 0
        working-directory: plugins/fchub-stream/portal-app
        run: |
          npm ci
          npm run build

      - name: Validate portal-app build
        if: steps.changes.outputs.count > 0
        run: |
          if [ ! -d "plugins/fchub-stream/portal-app/dist" ] || [ -z "$(ls -A plugins/fchub-stream/portal-app/dist)" ]; then
            echo "::error::portal-app build produced no output in portal-app/dist/"
            exit 1
          fi

          JS_COUNT=$(find plugins/fchub-stream/portal-app/dist -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JS files found in portal-app/dist/"
            exit 1
          fi

          echo "portal-app build validation passed: $JS_COUNT JS file(s)"

  repository-contract:
    name: Repository contract (catalogue, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Cheap enough to run unconditionally, and the things it guards are exactly
      # the ones a changed-path filter would have missed: the catalogue is
      # generated from files in two directories and consumed from a third.
      - name: Check catalogue drift
        run: node scripts/sync-fchub-catalog.mjs --check

      - name: Run catalogue contract
        run: node --test tests/repository/fchub-catalog.test.mjs

      - name: Verify FCHub documentation
        run: node scripts/check-fchub-docs.mjs
