name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '!plugins/fchub-stream/**'
      - 'plugins/fchub-stream/admin-app/package.json'
      - 'plugins/fchub-stream/admin-app/package-lock.json'
      - 'plugins/fchub-stream/portal-app/package.json'
      - 'plugins/fchub-stream/portal-app/package-lock.json'
      - 'plugins/fchub-stream/fchub-stream.php'
      - 'plugins/fchub-stream/readme.txt'
      - 'web-docs/lib/versions.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-memberships-contract.test.mjs'
      - '.github/workflows/ci-cartshift-contract.test.mjs'
      - '.github/workflows/ci-wporg-contract.test.mjs'
      - '.github/workflows/fchub-ci-contract.test.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-memberships-contract.test.mjs'
      - '.github/workflows/release-wporg-gates-contract.test.mjs'
      - '.github/workflows/wporg-release-gates.yml'
      - '.github/workflows/docs-ci.yml'
      - 'scripts/ci-scope.mjs'
      - 'scripts/ci-scope.test.mjs'
      - 'scripts/sync-fchub-catalog.mjs'
      - 'scripts/check-fchub-docs.mjs'
      - 'tests/repository/fchub-catalog.test.mjs'
      - 'tests/repository/plugin-dependency-locks.test.mjs'
      - 'tests/repository/plugin-version-contract.test.mjs'
      - 'tests/repository/wporg-package-contract.test.mjs'
      - 'tests/repository/wporg-updater-sync-contract.test.mjs'
      - 'tests/repository/wporg-metadata-contract.test.mjs'
      - 'tests/repository/wporg-previous-release-contract.test.mjs'
      - 'tests/repository/wporg-lifecycle-update-contract.test.mjs'
      - 'web-docs/lib/fchub-products.json'
      - 'wporg/**'
      - 'scripts/wporg/**'
      - 'build.sh'
      - 'lib/GitHubUpdater.php'
  pull_request:
    paths:
      - 'plugins/**'
      - '!plugins/fchub-stream/**'
      - 'plugins/fchub-stream/admin-app/package.json'
      - 'plugins/fchub-stream/admin-app/package-lock.json'
      - 'plugins/fchub-stream/portal-app/package.json'
      - 'plugins/fchub-stream/portal-app/package-lock.json'
      - 'plugins/fchub-stream/fchub-stream.php'
      - 'plugins/fchub-stream/readme.txt'
      - 'web-docs/lib/versions.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-memberships-contract.test.mjs'
      - '.github/workflows/ci-cartshift-contract.test.mjs'
      - '.github/workflows/ci-wporg-contract.test.mjs'
      - '.github/workflows/fchub-ci-contract.test.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-memberships-contract.test.mjs'
      - '.github/workflows/release-wporg-gates-contract.test.mjs'
      - '.github/workflows/wporg-release-gates.yml'
      - '.github/workflows/docs-ci.yml'
      - 'scripts/ci-scope.mjs'
      - 'scripts/ci-scope.test.mjs'
      - 'scripts/sync-fchub-catalog.mjs'
      - 'scripts/check-fchub-docs.mjs'
      - 'tests/repository/fchub-catalog.test.mjs'
      - 'tests/repository/plugin-dependency-locks.test.mjs'
      - 'tests/repository/plugin-version-contract.test.mjs'
      - 'tests/repository/wporg-package-contract.test.mjs'
      - 'tests/repository/wporg-updater-sync-contract.test.mjs'
      - 'tests/repository/wporg-metadata-contract.test.mjs'
      - 'tests/repository/wporg-previous-release-contract.test.mjs'
      - 'tests/repository/wporg-lifecycle-update-contract.test.mjs'
      - 'web-docs/lib/fchub-products.json'
      - 'wporg/**'
      - 'scripts/wporg/**'
      - 'build.sh'
      - 'lib/GitHubUpdater.php'

permissions:
  contents: read

# Three pushes to a branch used to start three full matrices and let all three
# run to the end. Only the newest one is telling you anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected plugin gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php_plugins: ${{ steps.scope.outputs.php_plugins }}
      wporg_plugins: ${{ steps.scope.outputs.wporg_plugins }}
      cartshift: ${{ steps.scope.outputs.cartshift }}
      memberships: ${{ steps.scope.outputs.memberships }}
      portal_extender: ${{ steps.scope.outputs.portal_extender }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select affected gates
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ci-scope.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            node scripts/ci-scope.mjs --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"

  workflow-contract:
    name: Workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Run owned workflow contracts
        run: node --test scripts/ci-scope.test.mjs .github/workflows/ci-memberships-contract.test.mjs .github/workflows/ci-cartshift-contract.test.mjs .github/workflows/ci-wporg-contract.test.mjs .github/workflows/release-memberships-contract.test.mjs .github/workflows/release-wporg-gates-contract.test.mjs

      - name: Run WordPress.org directory asset contracts
        run: node --test tests/repository/wporg-directory-assets-contract.test.mjs tests/repository/wporg-directory-screenshots-contract.test.mjs tests/repository/wporg-asset-approval-contract.test.mjs

      - name: Run WordPress.org release artifact contracts
        run: node --test tests/repository/wporg-metadata-contract.test.mjs tests/repository/wporg-previous-release-contract.test.mjs tests/repository/wporg-lifecycle-update-contract.test.mjs

      - name: Run FCHub workflow contracts
        run: node --test .github/workflows/fchub-ci-contract.test.mjs

  phpunit:
    name: PHPUnit (${{ matrix.plugin }})
    needs: changes
    if: needs.changes.outputs.php_plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.php_plugins) }}
        php_version: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node.js for Multi-Currency
        if: matrix.php_version == '8.5' && matrix.plugin == 'fchub-multi-currency'
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: composer audit --locked --no-interaction

      - name: Run PHPUnit
        working-directory: plugins/${{ matrix.plugin }}
        run: ./vendor/bin/phpunit

      - name: Run Multi-Currency browser behavior tests
        if: matrix.php_version == '8.5' && matrix.plugin == 'fchub-multi-currency'
        working-directory: plugins/${{ matrix.plugin }}
        run: node --test tests/js/*.test.mjs

      - name: Install pinned static analysis dependencies
        if: matrix.php_version == '8.5' && (matrix.plugin == 'fchub-fakturownia' || matrix.plugin == 'fchub-multi-currency' || matrix.plugin == 'fchub-p24' || matrix.plugin == 'fchub-wishlist')
        run: bash scripts/wporg/install-static-analysis-dependencies.sh "${{ matrix.plugin }}"

      - name: Run static quality checks
        if: matrix.php_version == '8.5' && (matrix.plugin == 'fchub-fakturownia' || matrix.plugin == 'fchub-multi-currency' || matrix.plugin == 'fchub-p24' || matrix.plugin == 'fchub-wishlist')
        working-directory: plugins/${{ matrix.plugin }}
        run: composer check

      - name: Run LOC budget check (fchub-wishlist)
        if: matrix.plugin == 'fchub-wishlist'
        working-directory: plugins/fchub-wishlist
        run: bash scripts/check-loc.sh

  wporg-package:
    name: WordPress.org package (${{ matrix.plugin }})
    needs: changes
    if: needs.changes.outputs.wporg_plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.wporg_plugins) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build and inspect archive
        run: bash build.sh "${{ matrix.plugin }}"

      - name: Upload rejected package evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wporg-package-${{ matrix.plugin }}-failure
          path: |
            dist/${{ matrix.plugin }}-*.zip
            dist/${{ matrix.plugin }}-*.inspection.json
          if-no-files-found: warn

  vite-build-cartshift:
    name: Vite Build (cartshift)
    needs: changes
    if: needs.changes.outputs.cartshift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: plugins/cartshift/package-lock.json

      - name: Install dependencies
        working-directory: plugins/cartshift
        run: npm ci

      - name: Audit JavaScript dependencies
        working-directory: plugins/cartshift
        run: npm audit --audit-level=high

      - name: Run JavaScript tests
        working-directory: plugins/cartshift
        run: npm test

      - name: Build production assets
        working-directory: plugins/cartshift
        run: npm run build

      - name: Validate build output
        working-directory: plugins/cartshift
        run: |
          if [ ! -d "resources/admin/dist" ] || [ -z "$(ls -A resources/admin/dist)" ]; then
            echo "::error::Build produced no output in resources/admin/dist/"
            exit 1
          fi

          JS_COUNT=$(find resources/admin/dist -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JS files found in resources/admin/dist/"
            exit 1
          fi

          echo "Build validation passed: $JS_COUNT JS file(s) in resources/admin/dist/"

      - name: Check the committed bundle matches the source
        run: |
          # The bundle is committed, and the admin loads the committed copy —
          # so a source change that never got rebuilt ships stale UI while every
          # test passes against source the user never sees.
          if [ -n "$(git status --porcelain -- plugins/cartshift/resources/admin/dist)" ]; then
            echo "::error::resources/admin/dist/ is out of date — run 'npm run build' and commit the result."
            git status --porcelain -- plugins/cartshift/resources/admin/dist
            exit 1
          fi

      - name: Verify reproducible package
        working-directory: ${{ github.workspace }}
        run: bash tests/build-reproducibility.sh

  vite-build-memberships:
    name: Vite Build (fchub-memberships)
    needs: changes
    if: needs.changes.outputs.memberships == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: plugins/fchub-memberships/package-lock.json

      - name: Install dependencies
        working-directory: plugins/fchub-memberships
        run: npm ci

      - name: Audit JavaScript dependencies
        working-directory: plugins/fchub-memberships
        run: npm audit --audit-level=high

      - name: Run JavaScript tests
        working-directory: plugins/fchub-memberships
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('plugins/fchub-memberships/package-lock.json') }}

      - name: Install Chromium
        working-directory: plugins/fchub-memberships
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: plugins/fchub-memberships
        run: npx playwright test

      - name: Build production assets
        working-directory: plugins/fchub-memberships
        run: npm run build

      - name: Validate build output
        working-directory: plugins/fchub-memberships
        run: |
          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build produced no output in assets/dist/"
            exit 1
          fi

          JS_COUNT=$(find assets/dist -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JS files found in assets/dist/"
            exit 1
          fi

          echo "Build validation passed: $JS_COUNT JS file(s) in assets/dist/"

  vite-build-portal-extender:
    name: Vite Build (fchub-portal-extender)
    needs: changes
    if: needs.changes.outputs.portal_extender == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: plugins/fchub-portal-extender/package-lock.json

      - name: Install and build
        working-directory: plugins/fchub-portal-extender
        run: |
          npm ci
          npm run build

      - name: Validate build output
        working-directory: plugins/fchub-portal-extender
        run: |
          if [ ! -d "assets/dist" ] || [ -z "$(ls -A assets/dist)" ]; then
            echo "::error::Build produced no output in assets/dist/"
            exit 1
          fi

          JS_COUNT=$(find assets/dist -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JS files found in assets/dist/"
            exit 1
          fi

          echo "Build validation passed: $JS_COUNT JS file(s) in assets/dist/"

  repository-contract:
    name: Repository contract (catalogue, plugin metadata, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # Cheap enough to run unconditionally, and the things it guards are exactly
      # the ones a changed-path filter would have missed: the catalogue is
      # generated from files in two directories and consumed from a third.
      - name: Check catalogue drift
        run: node scripts/sync-fchub-catalog.mjs --check

      - name: Run catalogue contract
        run: node --test tests/repository/fchub-catalog.test.mjs

      - name: Run plugin metadata contracts
        run: node --test tests/repository/plugin-dependency-locks.test.mjs tests/repository/plugin-version-contract.test.mjs

      - name: Verify FCHub documentation
        run: node scripts/check-fchub-docs.mjs
