# A release tag publishes the inspected npm tarball through Trusted Publishing, publishes immutable
# versioned containers, then promotes the same evidence to mutable tags and a GitHub Release.
name: MCP Release

on:
  push:
    tags:
      - 'fluentcart-mcp/v*'

jobs:
  validate:
    uses: ./.github/workflows/mcp-ci.yml

  sdk-current:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluentcart-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: fluentcart-mcp/package-lock.json
      - run: npm ci
      - name: Reverify current MCP SDK at the release boundary
        run: node scripts/verify-mcp-sdk-current.mjs --live --json > "${RUNNER_TEMP}/mcp-sdk-current.json"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-sdk-current-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mcp-sdk-current.json
          if-no-files-found: error
          retention-days: 30

  version-gate:
    runs-on: ubuntu-latest
    needs: [validate, sdk-current]
    steps:
      - name: Tag matches packaged version
        env:
          TAG_REF: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test "${TAG_REF#fluentcart-mcp/v}" = "$VERSION"

  docker:
    needs: [validate, version-gate]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mcp-docker.yml
    with:
      publish: true
      artifact_name: ${{ needs.validate.outputs.artifact_name }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      source_tree_digest: ${{ needs.validate.outputs.source_tree_digest }}
    secrets: inherit

  publish-npm:
    runs-on: ubuntu-latest
    needs: [validate, version-gate, docker]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26.7.0'
      - name: Install the reviewed publishing CLI
        run: npm install --global npm@11.19.0
      - name: Verify reviewed release toolchain
        run: |
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "11.19.0"
      - name: Publish inspected candidate through Trusted Publishing
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          TARBALL="./dist-packages/fluentcart-mcp-${VERSION}.tgz"
          npm publish "$TARBALL" --provenance --access public --tag latest \
            --registry https://registry.npmjs.org
      - name: Bind published npm and immutable containers into evidence
        env:
          PUBLISH_MODE: direct
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          SOURCE_TREE_DIGEST: ${{ needs.validate.outputs.source_tree_digest }}
          GHCR_DIGEST: ${{ needs.docker.outputs.ghcr_digest }}
          DOCKERHUB_DIGEST: ${{ needs.docker.outputs.dockerhub_digest }}
        run: node dist-packages/verification/scripts/write-staging-state.mjs
      - name: Reinspect the exact release handoff
        run: node dist-packages/verification/scripts/verify-staged-release.mjs --root dist-packages
      - uses: actions/upload-artifact@v7
        with:
          name: fluentcart-mcp-staging-${{ needs.validate.outputs.version }}
          path: dist-packages/
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: [validate, publish-npm]
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/mcp-promote.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      source_sha: ${{ needs.validate.outputs.source_sha }}
      staging_run_id: ${{ github.run_id }}
    secrets: inherit
