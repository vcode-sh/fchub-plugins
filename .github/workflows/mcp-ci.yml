name: MCP CI

on:
  push:
    branches: [main]
    paths:
      - 'fluentcart-mcp/**'
      - 'scripts/count-mcp-tools.mjs'
      - 'scripts/check-mcp-docs.mjs'
      - '.github/workflows/mcp-ci.yml'
      - '.github/workflows/mcp-release.yml'
      - '.github/workflows/mcp-docker.yml'
      - '.github/workflows/mcp-promote.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fluentcart-mcp/**'
      - 'scripts/count-mcp-tools.mjs'
      - 'scripts/check-mcp-docs.mjs'
      - '.github/workflows/mcp-ci.yml'
      - '.github/workflows/mcp-release.yml'
      - '.github/workflows/mcp-docker.yml'
      - '.github/workflows/mcp-promote.yml'
  workflow_call:
    outputs:
      version:
        description: 'Validated package version.'
        value: ${{ jobs.package.outputs.version }}
      source_sha:
        description: 'Committed source SHA represented by the artefacts.'
        value: ${{ jobs.package.outputs.source_sha }}
      source_tree_digest:
        description: 'Content-bound candidate identity.'
        value: ${{ jobs.package.outputs.source_tree_digest }}
      artifact_name:
        description: 'Immutable validated release artefact.'
        value: ${{ jobs.package.outputs.artifact_name }}

concurrency:
  group: mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fluentcart-mcp

env:
  RELEASE_ARTIFACT_NAME: release-artifacts

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluentcart-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run typecheck:tests
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluentcart-mcp/package-lock.json
      - run: npm ci
      - name: Unit
        run: npm run test:unit -- --coverage
      - name: Tooling
        run: npm run test:tooling
      - name: Acceptance contracts
        run: npm run test:acceptance

  conformance:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluentcart-mcp/package-lock.json
      - run: npm ci
      - run: npm run test:conformance
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-conformance-${{ github.run_id }}
          path: fluentcart-mcp/test-results/conformance/failure-metadata.json
          if-no-files-found: error

  protocol:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluentcart-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Dual-era stdio and HTTP production surfaces
        run: |
          node --test tests/protocol/stdio-dual-era.test.mjs
          node --test tests/protocol/http-dual-era.test.mjs
          node --test tests/protocol/production-surface.test.mjs

  package:
    runs-on: ubuntu-latest
    needs: [conformance, protocol]
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_tree_digest: ${{ steps.identity.outputs.source_tree_digest }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fluentcart-mcp/package-lock.json
      - run: npm ci
      - name: Generated truth
        working-directory: .
        run: |
          node scripts/count-mcp-tools.mjs --check
          node fluentcart-mcp/scripts/build-api-coverage.mjs --check
          cd fluentcart-mcp
          npm run check:contract
          npm run check:manifest
          npm run check:compatibility
          npm run check:routes -- --fixture tests/fixtures/routes/fluentcart-1.5.5-core-pro-1.5.4.json
      - run: npm run build
      - run: node dist/index.js --version && node dist/index.js --help
      - run: npm pack --dry-run
      - name: Package once from explicit captured state
        run: npm run pack:release -- --release-state tests/fixtures/releases/previous-release-state.json
      - run: node scripts/inspect-npm-pack.mjs dist-packages/fluentcart-mcp-*.tgz
      - run: node scripts/inspect-mcpb.mjs dist-packages/fluentcart-mcp.mcpb
      - run: git diff --exit-code -- package-lock.json package.json
      - name: Record identity
        id: identity
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIGEST=$(node -p "require('./release-contract.json').sourceTreeDigest")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "source_tree_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${RELEASE_ARTIFACT_NAME}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            fluentcart-mcp/dist-packages/
            fluentcart-mcp/scripts/smoke-public-stdio.mjs
          if-no-files-found: error
          retention-days: 14
