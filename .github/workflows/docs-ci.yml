# CI for web-docs and version consistency.
# Catches tool count drift, hardcoded release URLs, and versions.json validity.
name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - 'web-docs/**'
      - 'fluentcart-mcp/src/tools/**'
      - 'plugins/fchub-memberships/app/Http/**/*.php'
      - 'plugins/fchub-memberships/app/Modules/Runtime/FluentCartRuntimeModule.php'
      - 'scripts/check-memberships-image-zoom.mjs'
      - 'scripts/check-memberships-route-docs.mjs'
      - 'scripts/check-homepage-architecture.mjs'
      - 'scripts/check-fchub-docs.mjs'
      - 'scripts/sync-fchub-catalog.mjs'
      - 'scripts/count-mcp-tools.mjs'
      - 'scripts/mcp-doc-rules.mjs'
      - 'scripts/check-mcp-doc-links.mjs'
      - 'scripts/check-mcp-doc-links.test.mjs'
      - 'scripts/check-mcp-docs.test.mjs'
      - 'scripts/check-mcp-docs-experience.test.mjs'
      - 'fluentcart-mcp/package.json'
      - 'fluentcart-mcp/release-contract.json'
      - 'fluentcart-mcp/manifest.json'
      - 'fluentcart-mcp/api-coverage.json'
      - 'fluentcart-mcp/compatibility-support.json'
      - 'fluentcart-mcp/README.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'web-docs/content/docs/fluentcart-mcp/**'
      - 'web-docs/app/(home)/fluentcart-mcp/**'
      - 'web-docs/content/blog/fluentcart-mcp-vs-official-mcp.mdx'
      - 'fluentcart-mcp/Dockerfile'
      - 'fluentcart-mcp/docker-mcp-registry/**'
      - 'scripts/check-mcp-docs.mjs'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-docs/**'
      - 'fluentcart-mcp/src/tools/**'
      - 'plugins/fchub-memberships/app/Http/**/*.php'
      - 'plugins/fchub-memberships/app/Modules/Runtime/FluentCartRuntimeModule.php'
      - 'scripts/check-memberships-image-zoom.mjs'
      - 'scripts/check-memberships-route-docs.mjs'
      - 'scripts/check-homepage-architecture.mjs'
      - 'scripts/check-fchub-docs.mjs'
      - 'scripts/sync-fchub-catalog.mjs'
      - 'scripts/count-mcp-tools.mjs'
      - 'scripts/mcp-doc-rules.mjs'
      - 'scripts/check-mcp-doc-links.mjs'
      - 'scripts/check-mcp-doc-links.test.mjs'
      - 'scripts/check-mcp-docs.test.mjs'
      - 'scripts/check-mcp-docs-experience.test.mjs'
      - 'fluentcart-mcp/package.json'
      - 'fluentcart-mcp/release-contract.json'
      - 'fluentcart-mcp/manifest.json'
      - 'fluentcart-mcp/api-coverage.json'
      - 'fluentcart-mcp/compatibility-support.json'
      - 'fluentcart-mcp/README.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'web-docs/content/docs/fluentcart-mcp/**'
      - 'web-docs/app/(home)/fluentcart-mcp/**'
      - 'web-docs/content/blog/fluentcart-mcp-vs-official-mcp.mdx'
      - 'fluentcart-mcp/Dockerfile'
      - 'fluentcart-mcp/docker-mcp-registry/**'
      - 'scripts/check-mcp-docs.mjs'
      - '.github/workflows/docs-ci.yml'

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The site has to actually build. Every check below this one reads content
  # and compares it against something; none of them run Next, which is how a
  # docs site that cannot be built sat on main behind a green tick. Two real
  # breakages hid here: a floating base-image tag that took the Docker build
  # with it, and a duplicated @base-ui/react that left a React context
  # unresolvable at prerender. Both were invisible to every gate in this file.
  build:
    name: Site builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-docs
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      # --frozen-lockfile on purpose: the committed lockfile is what deploys,
      # so a build that only passes after resolution drifts is not a pass.
      - name: Install
        run: bun install --frozen-lockfile

      # Node, not bun, and Next invoked directly — the same command
      # web-docs/Dockerfile runs, so this gate exercises the path that ships
      # rather than a convenient local approximation. NEXT_PUBLIC_URL matches
      # the Dockerfile's default for the same reason.
      - name: Build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_URL: https://fchub.co
        run: node ./node_modules/next/dist/bin/next build

  consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Validate versions.json
        run: node -e "JSON.parse(require('fs').readFileSync('web-docs/lib/versions.json','utf8'))"

      - name: Verify Memberships route documentation
        run: node --test scripts/check-memberships-route-docs.mjs

      - name: Verify Fumadocs accordion structure
        run: node --test scripts/check-fumadocs-accordion-structure.mjs

      - name: Verify FluentCart API documentation link
        run: node --test scripts/check-fluentcart-api-link.mjs

      - name: Verify homepage architecture
        run: node --test scripts/check-homepage-architecture.mjs

      - name: Verify Memberships image lightboxes
        run: node --test scripts/check-memberships-image-zoom.mjs

      - name: Verify FCHub product-centre documentation
        run: node scripts/check-fchub-docs.mjs

      # The catalogue is generated from versions.json and fchub-products.json,
      # and copied into both the website and the plugin. Bumping a version
      # without regenerating it leaves two stale copies and a product centre
      # offering an older release than the docs page beside it.
      - name: Check FCHub catalogue drift
        run: node scripts/sync-fchub-catalog.mjs --check

      - name: Verify tool counts match source
        run: node scripts/count-mcp-tools.mjs --check

      # Current-facing MCP pages must not claim behaviour the code no longer has. Ground truth
      # is release-contract.json, so this cannot drift from the measurement that produced it.
      - name: Verify MCP documentation claims
        run: node scripts/check-mcp-docs.mjs

      - name: Verify MCP documentation links
        run: node scripts/check-mcp-doc-links.mjs

      - name: Test MCP documentation link contracts
        run: node --test scripts/check-mcp-doc-links.test.mjs

      - name: Test FluentCart MCP documentation contracts
        run: node --test scripts/check-mcp-docs.test.mjs scripts/check-mcp-docs-experience.test.mjs

      - name: Check for hardcoded release URLs
        run: |
          HARDCODED=$(grep -rn "releases/tag/" web-docs/content/ web-docs/app/ --include="*.mdx" --include="*.tsx" | grep -v _changelog | grep -v versions || true)
          if [ -n "$HARDCODED" ]; then
            echo "::error::Found hardcoded release URLs. Use <PluginDownload> or versions imports instead."
            echo "$HARDCODED"
            exit 1
          fi
