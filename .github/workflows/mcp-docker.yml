name: MCP Docker Candidate

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      artifact_name:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      source_tree_digest:
        type: string
        required: true
    outputs:
      ghcr_digest:
        value: ${{ jobs.publish.outputs.ghcr_digest }}
      dockerhub_digest:
        value: ${{ jobs.publish.outputs.dockerhub_digest }}
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false

env:
  GHCR_IMAGE: ghcr.io/vcode-sh/fluentcart-mcp
  DOCKERHUB_IMAGE: vcodesh/fluentcart-mcp
  LOCAL_REPOSITORY: vcodesh/fluentcart-mcp
  IMAGE_ARTIFACT: fluentcart-mcp-image
  SMOKE_API_KEY: smoke-test-key-0123456789abcdefghijklmnop

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/mcp-ci.yml

  verify:
    runs-on: ubuntu-latest
    needs: [validate]
    if: always() && (github.event_name != 'workflow_dispatch' || needs.validate.result == 'success')
    outputs:
      version: ${{ steps.build.outputs.version }}
      source_sha: ${{ steps.build.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || needs.validate.outputs.artifact_name }}
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            fluentcart-mcp/scripts
            fluentcart-mcp/tests/acceptance/docker.test.mjs
            fluentcart-mcp/package.json
            fluentcart-mcp/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked script dependencies
        run: npm ci --prefix fluentcart-mcp
      - name: Build candidate from validated context
        id: build
        env:
          SOURCE_SHA: ${{ inputs.source_sha || needs.validate.outputs.source_sha }}
        run: |
          node -e "if (!/^[0-9a-f]{40}$/.test(process.env.SOURCE_SHA ?? '')) throw Error('source_sha must be exactly 40 lowercase hexadecimal characters')"
          node fluentcart-mcp/scripts/build-validated-docker-image.mjs \
            --context dist-packages/fluentcart-mcp-docker-context.tar.gz \
            --checksums dist-packages/SHA256SUMS.json \
            --source-sha "$SOURCE_SHA" \
            --repository "${LOCAL_REPOSITORY}" > build.json
          echo "version=$(node -p "require('./build.json').version")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(node -p "require('./build.json').sourceSha")" >> "$GITHUB_OUTPUT"
      - name: Refuses missing private key before listen
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          ! docker run --rm \
            -e FLUENTCART_MCP_ALLOWED_HOSTS=127.0.0.1 \
            -e FLUENTCART_MCP_ALLOWED_ORIGINS=127.0.0.1 \
            "${LOCAL_REPOSITORY}:${VERSION}"
      - name: Refuses missing private allowlists before listen
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          ! docker run --rm -e FLUENTCART_MCP_API_KEY="${SMOKE_API_KEY}" \
            "${LOCAL_REPOSITORY}:${VERSION}"
      - name: Refuses a short private key before listen
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          ! docker run --rm \
            -e FLUENTCART_MCP_API_KEY=too-short \
            -e FLUENTCART_MCP_ALLOWED_HOSTS=127.0.0.1 \
            -e FLUENTCART_MCP_ALLOWED_ORIGINS=127.0.0.1 \
            "${LOCAL_REPOSITORY}:${VERSION}"
      - name: Start deterministic capability fixture
        run: |
          node fluentcart-mcp/scripts/serve-mcp-capability-fixture.mjs --port 39082 > fixture.log 2>&1 &
          echo "$!" > fixture.pid
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:39082/wp-json/fluent-cart/v2 >/dev/null 2>&1 && break
            test "$attempt" != 20
            sleep 1
          done
          mkdir -p smoke-config
          node -e "require('fs').writeFileSync('smoke-config/config.json', JSON.stringify({url:'http://host.docker.internal:39082',username:'fixture',appPassword:'fixture'}))"
      - name: Private candidate speaks authenticated MCP
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          docker run -d --name fcmcp-smoke \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1:3000:3000 \
            -v "${PWD}/smoke-config:/home/node/.config/fluentcart-mcp:ro" \
            -e FLUENTCART_MCP_API_KEY="${SMOKE_API_KEY}" \
            -e FLUENTCART_MCP_ALLOWED_HOSTS=127.0.0.1 \
            -e FLUENTCART_MCP_ALLOWED_ORIGINS=127.0.0.1 \
            "${LOCAL_REPOSITORY}:${VERSION}"
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break
            test "$attempt" != 30
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/mcp)" = 401
          node fluentcart-mcp/scripts/smoke-mcp-http.mjs \
            http://127.0.0.1:3000/mcp "${SMOKE_API_KEY}"
      - name: Required image acceptance
        env:
          FLUENTCART_ACCEPTANCE_REQUIRED: 'yes'
          FLUENTCART_ACCEPTANCE_IMAGE: ${{ env.LOCAL_REPOSITORY }}:${{ steps.build.outputs.version }}
          FLUENTCART_ACCEPTANCE_SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
          FLUENTCART_ACCEPTANCE_SOURCE_TREE_DIGEST: ${{ inputs.source_tree_digest || needs.validate.outputs.source_tree_digest }}
          FLUENTCART_ACCEPTANCE_STORE_URL: http://host.docker.internal:39082
        run: node --test fluentcart-mcp/tests/acceptance/docker.test.mjs
      - if: always()
        run: |
          docker rm -f fcmcp-smoke || true
          test ! -f fixture.pid || kill "$(cat fixture.pid)" || true
      - run: docker save "${LOCAL_REPOSITORY}:${{ steps.build.outputs.version }}" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: image.tar
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [verify]
    if: inputs.publish
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr_digest: ${{ steps.digests.outputs.ghcr_digest }}
      dockerhub_digest: ${{ steps.digests.outputs.dockerhub_digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
      - run: docker load -i image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push versioned tags only
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for TARGET in "${GHCR_IMAGE}" "${DOCKERHUB_IMAGE}"; do
            docker tag "${LOCAL_REPOSITORY}:${VERSION}" "${TARGET}:${VERSION}"
            docker push "${TARGET}:${VERSION}"
          done
      - name: Record immutable registry digests
        id: digests
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          GHCR_DIGEST=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          DOCKERHUB_DIGEST=$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "ghcr_digest=$GHCR_DIGEST" >> "$GITHUB_OUTPUT"
          echo "dockerhub_digest=$DOCKERHUB_DIGEST" >> "$GITHUB_OUTPUT"
